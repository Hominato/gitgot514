version: "3.9"

services:
  panel:
    build: .
    container_name: gphish-panel
    environment:
      - GPANEL_HTTP=1
      - GPANEL_USER=${GPANEL_USER:-op1}
      - GPANEL_PASS=${GPANEL_PASS:-changeme}
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - gphish

  nginx:
    image: nginx:alpine
    container_name: gphish-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - panel
    restart: unless-stopped
    networks:
      - gphish
    # NOTE: alternative — comment out nginx and uncomment ngrok below
    # for a quick tunnel instead of a full self-hosted front.

  # ngrok tunnel variant — uncomment to use instead of nginx:
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: gphish-ngrok
  #   command: http http://panel:5443 --log=stdout --log-format=termline
  #   environment:
  #     - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
  #   depends_on:
  #     - panel
  #   restart: unless-stopped
  #   networks:
  #     - gphish

networks:
  gphish:
    driver: bridge
